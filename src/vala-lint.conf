[Checks]
block-opening-brace-space-before=off
double-semicolon=error
double-spaces=error
ellipsis=off
line-length=error
naming-convention=error
no-space=error
note=off
space-before-paren=error
use-of-tabs=error
trailing-newlines=error
trailing-whitespace=error
unnecessary-string-template=error

[Disabler]
disable-by-inline-comments=true

[line-length]
max-line-length=100
ignore-comments=false

[naming-convention]
exceptions=UUID,

[note]
keywords=TODO,FIXME,
