name: Build & Test

on:
  push:
    branches: [ v2 ]
  pull_request:
    branches: [ v2 ]

jobs:
  build-n-test:

    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v7
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          meson build-essential valac libadwaita-1-dev appstream-util \
          desktop-file-utils gettext
    - name: Configure
      run: meson setup build
    - name: Build
      run: ninja -C build
    - name: Test
      run: ninja -C build test

  flatpak-build:

    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/darazaki/flatpak-actions-images:gnome-51
      options: --privileged

    steps:
    - uses: actions/checkout@v7
    - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
      with:
        bundle: Spedread.flatpak
        manifest-path: com.github.Darazaki.Spedread.json

  snap-build:

    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v7
    - name: Set up LXD and Snapcraft
      run: |
        snap list lxd >/dev/null 2>&1 || sudo snap install lxd
        sudo lxd init --auto
        sudo usermod -aG lxd "$USER"
        sudo iptables -P FORWARD ACCEPT
        sudo snap install snapcraft --classic
    - name: Build snap
      run: sg lxd -c 'snapcraft pack --use-lxd --build-for=amd64'
    - name: Install built snap package
      run: sudo snap install --dangerous ./*.snap
    - name: Verify that the installed snap package runs
      run: spedread --help
    - uses: actions/upload-artifact@v4
      with:
        name: Spedread-x86_64.snap
        path: ./*.snap
